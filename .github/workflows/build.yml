name: Build MCP Server

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      # gets your code
        uses: actions/checkout@v4

      - name: Setup Node.js
      # uses Node 20 (your dependencies want modern Node)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
      # installs everything in package.json
        run: npm install

      - name: Build TypeScript + database
      # runs your script:
      #   tsc
      #   cp src/pdf-wrapper.cjs → dist/
      #   node dist/build-database.js
        run: npm run build

      - name: Verify output
      # sanity check — ensures dist/index.js exists
        run: ls -R dist
